<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Frog Season</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d6dcb6; }
      canvas { display: block; touch-action: none; }
      #hint {
        position: fixed; bottom: 16px; left: 16px; right: 16px; margin: 0;
        font: 14px/1.4 system-ui, sans-serif; color: #2f3b22; opacity: 0.75;
        text-align: center; pointer-events: none;
      }
      #title {
        position: fixed; top: 16px; left: 16px; margin: 0;
        font: 600 20px/1.2 system-ui, sans-serif; color: #2f3b22; opacity: 0.8;
        pointer-events: none;
      }
      #place { display: block; font-size: 14px; font-weight: 500; opacity: 0.8; margin-top: 2px; }
      #travel {
        position: fixed; top: 14px; right: 16px;
        font: 600 14px/1 system-ui, sans-serif; color: #2f3b22;
        background: rgba(255, 250, 230, 0.6); border: 1.5px solid rgba(47, 59, 34, 0.35);
        border-radius: 999px; padding: 10px 16px; cursor: pointer;
      }
      #travel:hover { background: rgba(255, 250, 230, 0.85); }
      #fade {
        position: fixed; inset: 0; opacity: 0; pointer-events: none;
        transition-property: opacity; transition-timing-function: ease-in-out;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Frog Season<span id="place"></span></h1>
    <button id="travel" type="button"></button>
    <div id="fade"></div>
    <p id="hint"></p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
